name: alera_mobile_native
description: Native Whisper inference for the Alera mobile app.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.2"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true

dev_dependencies:
  flutter_lints: ^6.0.0
