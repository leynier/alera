name: alera_browser
description: Alera's fail-closed desktop browser engine boundary.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.18.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: AleraBrowserPlugin
      macos:
        pluginClass: AleraBrowserPlugin
      windows:
        pluginClass: AleraBrowserPluginCApi
