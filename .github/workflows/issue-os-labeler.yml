name: Label Issues By OS

on:
  issues:
    types:
      - opened
      - edited
      - reopened

permissions:
  issues: write

jobs:
  apply-os-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply OS label from issue form
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";
            const osMatch = body.match(/^### Operating system\s+(.+)$/m);

            if (!osMatch) {
              core.info("No operating system field found. Skipping.");
              return;
            }

            const selectedOs = osMatch[1].trim().toLowerCase();
            const osLabelMap = {
              macos: "os:macos",
              windows: "os:windows",
              linux: "os:linux",
            };

            const desiredLabel = osLabelMap[selectedOs];
            const managedLabels = Object.values(osLabelMap);
            const existingLabels = issue.labels.map((label) =>
              typeof label === "string" ? label : label.name,
            );
            const labelsToKeep = existingLabels.filter(
              (label) => !managedLabels.includes(label),
            );
            const nextLabels = desiredLabel
              ? [...new Set([...labelsToKeep, desiredLabel])]
              : labelsToKeep;

            if (desiredLabel) {
              const labelColors = {
                "os:macos": "5319e7",
                "os:windows": "1d76db",
                "os:linux": "0e8a16",
              };

              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: desiredLabel,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: desiredLabel,
                  color: labelColors[desiredLabel],
                  description: `Reported on ${selectedOs}.`,
                });
              }
            }

            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: nextLabels,
            });

            if (desiredLabel) {
              core.info(`Applied label ${desiredLabel} to issue #${issue.number}.`);
            } else {
              core.info(`Cleared managed OS labels for "${selectedOs}" on issue #${issue.number}.`);
            }
