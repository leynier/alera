name: Landing

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'landing/**'
      - 'edge/skills/**'
      - 'edge/tool/skill_catalog.ts'
      - 'assets/logo/alera-logo.png'
      - 'LICENSE'
      - '.github/workflows/landing.yml'
  workflow_dispatch:

# A newer commit makes the checks for the previous one irrelevant, and superseded
# runs otherwise keep saturating the runner pool for the whole repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The browser download and its apt dependencies are the longest step
      # before the end-to-end suite and touch nothing under landing/, so they
      # install while the unit tests, type check and build run. Those three
      # stay sequential: `astro sync` and `astro build` both write .astro/.
      - name: Install Playwright Chromium
        id: playwright
        background: true
        run: bunx playwright install --with-deps chromium

      - name: Unit tests
        run: bun test

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Wait for Playwright Chromium
        wait: playwright

      - name: End-to-end tests
        run: bunx playwright test

      - name: Upload plugin bundle
        uses: actions/upload-artifact@v7
        with:
          name: alera-plugin
          path: |
            landing/dist/downloads/alera-plugin.zip
            landing/dist/downloads/alera-plugin.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: landing-playwright-report
          path: |
            landing/playwright-report
            landing/test-results
          retention-days: 7

      - name: Upload Claude web plugin bundle
        uses: actions/upload-artifact@v7
        with:
          name: alera-claude-plugin
          path: |
            landing/dist/downloads/alera-claude-plugin.zip
            landing/dist/downloads/alera-claude-plugin.zip.sha256
            landing/dist/downloads/alera-claude.plugin
            landing/dist/downloads/alera-claude.plugin.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload GrokBot Cursor plugin bundle
        uses: actions/upload-artifact@v7
        with:
          name: alera-grokbot-cursor-plugin
          path: |
            landing/dist/downloads/alera-grokbot-cursor-plugin.zip
            landing/dist/downloads/alera-grokbot-cursor-plugin.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload pure Agent Plugin bundle
        uses: actions/upload-artifact@v7
        with:
          name: alera-agent-plugin
          path: |
            landing/dist/downloads/alera-agent-plugin.zip
            landing/dist/downloads/alera-agent-plugin.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Copilot plugin bundle
        uses: actions/upload-artifact@v7
        with:
          name: alera-copilot-plugin
          path: |
            landing/dist/downloads/alera-copilot-plugin.zip
            landing/dist/downloads/alera-copilot-plugin.zip.sha256
          if-no-files-found: error
          retention-days: 30

  landing-ready:
    name: landing-ready
    if: always()
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require landing checks
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::BUILD_RESULT was ${BUILD_RESULT}"
            exit 1
          fi
