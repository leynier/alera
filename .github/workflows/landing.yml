name: Landing

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'landing/**'
      - '.github/workflows/landing.yml'
  workflow_dispatch:

# A newer commit makes the checks for the previous one irrelevant, and superseded
# runs otherwise keep saturating the runner pool for the whole repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bunx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: landing-playwright-report
          path: |
            landing/playwright-report
            landing/test-results
          retention-days: 7

  landing-ready:
    name: landing-ready
    if: always()
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require landing checks
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::BUILD_RESULT was ${BUILD_RESULT}"
            exit 1
          fi
