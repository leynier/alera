name: Temporary dependency upgrade validation

on:
  push:
    branches:
      - codex/dependency-upgrades-2026-08

permissions:
  contents: read

concurrency:
  group: dependency-upgrade-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clipboard:
    name: native clipboard (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
    env:
      ALERA_FLAVOR: dev
      ALERA_NATIVE_TEST_CLIPBOARD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          linux-toolchain: 'false'
          rust: 'true'

      - name: Tune Windows build environment
        if: runner.os == 'Windows'
        uses: ./.github/actions/tune-windows-build

      - name: Configure Windows native compilation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'CMAKE_GENERATOR=Ninja' >> $env:GITHUB_ENV
          'GGML_CCACHE=OFF' >> $env:GITHUB_ENV
          '_CL_=/Z7 /FS' >> $env:GITHUB_ENV

      - name: Verify locked resolution
        shell: bash
        run: flutter pub get --enforce-lockfile

      - name: Verify native clipboard on the disposable desktop
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p validation-evidence
          flutter test integration_test/terminal_input_native_test.dart \
            -d "$PLATFORM" --no-pub --reporter expanded \
            2>&1 | tee validation-evidence/clipboard.log

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-upgrade-clipboard-${{ matrix.platform }}
          path: validation-evidence/
          if-no-files-found: warn
          retention-days: 7

  windows_host:
    name: windows full terminal-host conformance
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: R:\c\cli
      CMAKE_GENERATOR: Ninja
      _CL_: /Z7 /FS
      GGML_CCACHE: 'OFF'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          linux-toolchain: 'false'
          native-assets: 'false'
          preflight: 'false'
          rust: 'true'

      - name: Tune Windows build environment
        uses: ./.github/actions/tune-windows-build

      - name: Verify full host conformance on the disposable account
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-evidence
          cargo test --manifest-path rust/Cargo.toml -p alera-cli \
            --test terminal_host_conformance --locked -- --test-threads=2 \
            2>&1 | tee validation-evidence/windows-host.log

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-upgrade-windows-host
          path: validation-evidence/
          if-no-files-found: warn
          retention-days: 7
