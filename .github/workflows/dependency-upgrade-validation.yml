name: Temporary dependency upgrade validation

on:
  push:
    branches:
      - codex/dependency-upgrades-2026-08

permissions:
  contents: read

concurrency:
  group: dependency-upgrade-validation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  windows_host:
    name: windows full terminal-host conformance
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: R:\c\cli
      CMAKE_GENERATOR: Ninja
      _CL_: /Z7 /FS
      GGML_CCACHE: 'OFF'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          linux-toolchain: 'false'
          native-assets: 'false'
          preflight: 'false'
          rust: 'true'

      - name: Tune Windows build environment
        uses: ./.github/actions/tune-windows-build

      - name: Verify full host conformance on the disposable account
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation-evidence | Out-Null
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test --manifest-path rust/Cargo.toml -p alera-cli `
            --test terminal_host_conformance --locked -- --test-threads=2 `
            2>&1 | Tee-Object -FilePath validation-evidence/windows-host.log
          exit $LASTEXITCODE

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-upgrade-windows-host
          path: validation-evidence/
          if-no-files-found: warn
          retention-days: 7
