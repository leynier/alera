name: Temporary dependency upgrade validation

on:
  push:
    branches:
      - codex/dependency-upgrades-2026-08

permissions:
  contents: read

concurrency:
  group: dependency-upgrade-validation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  clipboard:
    name: native clipboard (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
    env:
      ALERA_FLAVOR: dev
      ALERA_NATIVE_TEST_CLIPBOARD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          linux-toolchain: 'false'
          rust: 'true'

      - name: Tune Windows build environment
        if: runner.os == 'Windows'
        uses: ./.github/actions/tune-windows-build

      - name: Verify locked resolution
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Verify native clipboard on the disposable desktop
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p validation-evidence
          flutter test integration_test/terminal_input_native_test.dart \
            -d "$PLATFORM" --no-pub --reporter expanded \
            2>&1 | tee validation-evidence/clipboard.log

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-upgrade-clipboard-${{ matrix.platform }}
          path: validation-evidence/
          if-no-files-found: warn
          retention-days: 7
