name: Desktop Builds

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

# A newer commit makes the checks for the previous one irrelevant, and superseded
# runs otherwise keep saturating the runner pool for the whole repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ALERA_FLAVOR: release

jobs:
  build:
    name: build ${{ matrix.platform }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          rust: 'true'

      - name: Build desktop app
        run: flutter build ${{ matrix.platform }} --release --dart-define=ALERA_FLAVOR=release
