name: Desktop Builds
run-name: Desktop validation - ${{ inputs.source_sha || github.sha }}

on:
  workflow_call:
    inputs:
      source_sha:
        description: Expected triggering commit SHA; empty skips the assertion.
        type: string
        default: ''
      full_validation:
        description: Also run golden tests and Linux desktop E2E.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      source_sha:
        description: Expected 40-character SHA of the selected workflow ref.
        type: string
        default: ''
      full_validation:
        description: Also run golden tests and Linux desktop E2E.
        type: boolean
        default: false

# A newer commit makes the checks for the previous one irrelevant, and superseded
# runs otherwise keep saturating the runner pool for the whole repository.
# Explicit SHA dispatches remain independent from automatic builds and each other.
concurrency:
  group: desktop-builds-${{ github.event.pull_request.number || github.ref }}-${{ inputs.source_sha }}-${{ inputs.full_validation }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ALERA_FLAVOR: release

jobs:
  revision:
    name: validation revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Require an immutable revision
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase commit SHA, not a branch or tag."
            exit 1
          fi
          if [ "$SOURCE_SHA" != "$TRIGGER_SHA" ]; then
            echo "::error::source_sha must match the selected workflow ref. Dispatch from the branch containing that commit."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: false
          persist-credentials: false

      - name: Record validation revision
        id: revision
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SOURCE_SHA"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          {
            echo "### Desktop validation revision"
            echo "Source commit: $actual"
            echo "Workflow commit: $WORKFLOW_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: revision
    name: build ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: false
          persist-credentials: false

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          rust: 'true'
          xvfb: 'true'

      - name: Tune Windows build environment
        if: runner.os == 'Windows'
        uses: ./.github/actions/tune-windows-build

      # Cargokit contains fully linked alera_native and code_forge outputs, so
      # restoring it remains faster than compiler caching alone. Only the
      # warm-cache workflow saves, so pull requests never write a private copy.
      - name: Restore cargokit build
        uses: actions/cache/restore@v6
        with:
          path: |
            build/**/cargokit_build
            build/**/ck
          key: cargokit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-
          restore-keys: |
            cargokit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-
            cargokit-${{ runner.os }}-${{ runner.arch }}-

      - name: Build desktop app
        run: flutter build ${{ matrix.platform }} --release --dart-define=ALERA_FLAVOR=release

      - name: Capture native typography at three scales
        shell: bash
        env:
          # Flutter's test launcher expects the default development binary.
          ALERA_FLAVOR: dev
          PLATFORM: ${{ matrix.platform }}
          ALERA_VISUAL_REVIEW_DIR: ${{ github.workspace }}/build/typography-review
        run: |
          set -euo pipefail
          if [[ "$PLATFORM" == "linux" ]]; then
            xvfb-run -a flutter test integration_test/typography_rendering_test.dart -d linux --reporter expanded
          else
            flutter test integration_test/typography_rendering_test.dart -d "$PLATFORM" --reporter expanded
          fi

      - name: Upload native typography captures
        uses: actions/upload-artifact@v7
        with:
          name: typography-${{ matrix.platform }}
          path: build/typography-review/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Verify macOS startup and desktop presence
        if: matrix.platform == 'macos'
        env:
          ALERA_FLAVOR: dev
        run: flutter test integration_test/desktop_presence_macos_test.dart -d macos --reporter expanded

      - name: Verify Windows single-instance runner
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $cache = Get-Content build/windows/x64/CMakeCache.txt
          $generator = ($cache | Select-String '^CMAKE_GENERATOR:INTERNAL=').Line.Split('=', 2)[1]
          if (-not $generator) { throw 'Flutter CMake generator was not found' }
          cmake -S windows/runner/tests -B build/windows-runner-tests -G $generator -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows-runner-tests --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/windows-runner-tests -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify bundled helper and video runtimes
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            macos)
              bundle="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
              ;;
            windows)
              executable="$(find build/windows -type f -name 'Alera.exe' -path '*/Release/*' -print -quit)"
              bundle="$(dirname "$executable")"
              ;;
            linux)
              bundle="build/linux/x64/release/bundle"
              ;;
          esac
          test -d "$bundle" || { echo "::error::Missing desktop bundle for $PLATFORM"; exit 1; }
          dart tool/native_helpers/verify_desktop_runtime_bundle.dart \
            --platform "$PLATFORM" \
            --bundle "$bundle"
          if [[ "$PLATFORM" == "macos" ]]; then
            bash tool/release/verify_macos_arm64_only.sh "$bundle"
          fi

      # The shortened Windows layout avoids MSBuild's legacy path limit while
      # the other platforms retain Cargokit's standard directory name.
      - name: Report cargokit build layout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          found=$(find build -type d \( -name cargokit_build -o -name ck \) 2>/dev/null || true)
          if [ -z "$found" ]; then
            echo "No Cargokit build directory under build/ on ${{ runner.os }}."
            exit 0
          fi
          echo "$found" | while read -r dir; do
            du -sh "$dir" 2>/dev/null || echo "$dir"
          done

      - name: Report sccache statistics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### sccache ${{ matrix.platform }}"
            echo '```text'
            sccache --show-stats || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  golden:
    name: validation golden
    if: inputs.full_validation
    needs: revision
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: false
          persist-credentials: false

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          linux-toolchain: 'false'

      - name: Golden tests
        run: flutter test test/golden

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures-${{ needs.revision.outputs.sha }}
          path: test/golden/**/failures/**
          if-no-files-found: ignore

  desktop_e2e_linux:
    name: validation desktop e2e linux
    env:
      # Flutter parses the first CMake binary name, which is the dev executable.
      ALERA_FLAVOR: dev
    if: inputs.full_validation
    needs: revision
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: false
          persist-credentials: false

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          xvfb: 'true'
          enable-linux-desktop: 'true'
          rust: 'true'

      # Separate launches are required by the desktop integration test runner.
      - name: Desktop E2E
        run: |
          set -euo pipefail
          for suite in integration_test/*_test.dart; do
            echo "::group::${suite}"
            xvfb-run -a flutter test "${suite}" -d linux -r github
            echo "::endgroup::"
          done

      - name: Report sccache statistics
        if: always()
        run: |
          {
            echo "### sccache desktop E2E"
            echo '```text'
            sccache --show-stats || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  validation_ready:
    name: desktop-validation-ready
    if: ${{ always() && inputs.full_validation }}
    needs: [revision, build, golden, desktop_e2e_linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs
        shell: bash
        env:
          REVISION_RESULT: ${{ needs.revision.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          GOLDEN_RESULT: ${{ needs.golden.result }}
          E2E_RESULT: ${{ needs.desktop_e2e_linux.result }}
          SOURCE_SHA: ${{ needs.revision.outputs.sha }}
        run: |
          set -euo pipefail
          for result in "$REVISION_RESULT" "$BUILD_RESULT" "$GOLDEN_RESULT" "$E2E_RESULT"; do
            if [ "$result" != success ]; then
              echo "::error::Desktop validation did not pass: $result"
              exit 1
            fi
          done
          echo "Full desktop validation passed for $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
