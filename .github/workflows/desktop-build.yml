name: Desktop Builds

on:
  workflow_call:
  workflow_dispatch:

# A newer commit makes the checks for the previous one irrelevant, and superseded
# runs otherwise keep saturating the runner pool for the whole repository.
concurrency:
  group: desktop-builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ALERA_FLAVOR: release

jobs:
  build:
    name: build ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          rust: 'true'
          xvfb: 'true'

      - name: Tune Windows build environment
        if: runner.os == 'Windows'
        uses: ./.github/actions/tune-windows-build

      # Cargokit contains fully linked alera_native and code_forge outputs, so
      # restoring it remains faster than compiler caching alone. Only the
      # warm-cache workflow saves, so pull requests never write a private copy.
      - name: Restore cargokit build
        uses: actions/cache/restore@v6
        with:
          path: |
            build/**/cargokit_build
            build/**/ck
          key: cargokit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-
          restore-keys: |
            cargokit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-
            cargokit-${{ runner.os }}-${{ runner.arch }}-

      - name: Build desktop app
        run: flutter build ${{ matrix.platform }} --release --dart-define=ALERA_FLAVOR=release

      - name: Capture native typography at three scales
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ALERA_VISUAL_REVIEW_DIR: ${{ github.workspace }}/build/typography-review
        run: |
          set -euo pipefail
          if [[ "$PLATFORM" == "linux" ]]; then
            xvfb-run -a flutter test integration_test/typography_rendering_test.dart -d linux --reporter expanded
          else
            flutter test integration_test/typography_rendering_test.dart -d "$PLATFORM" --reporter expanded
          fi

      - name: Upload native typography captures
        uses: actions/upload-artifact@v7
        with:
          name: typography-${{ matrix.platform }}
          path: build/typography-review/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Verify macOS startup and desktop presence
        if: matrix.platform == 'macos'
        run: flutter test integration_test/desktop_presence_macos_test.dart -d macos --reporter expanded

      - name: Verify Windows single-instance runner
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $cache = Get-Content build/windows/x64/CMakeCache.txt
          $generator = ($cache | Select-String '^CMAKE_GENERATOR:INTERNAL=').Line.Split('=', 2)[1]
          if (-not $generator) { throw 'Flutter CMake generator was not found' }
          cmake -S windows/runner/tests -B build/windows-runner-tests -G $generator -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows-runner-tests --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/windows-runner-tests -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify bundled helper and video runtimes
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            macos)
              bundle="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
              ;;
            windows)
              executable="$(find build/windows -type f -name 'Alera.exe' -path '*/Release/*' -print -quit)"
              bundle="$(dirname "$executable")"
              ;;
            linux)
              bundle="build/linux/x64/release/bundle"
              ;;
          esac
          test -d "$bundle" || { echo "::error::Missing desktop bundle for $PLATFORM"; exit 1; }
          dart tool/native_helpers/verify_desktop_runtime_bundle.dart \
            --platform "$PLATFORM" \
            --bundle "$bundle"
          if [[ "$PLATFORM" == "macos" ]]; then
            bash tool/release/verify_macos_arm64_only.sh "$bundle"
          fi

      # The shortened Windows layout avoids MSBuild's legacy path limit while
      # the other platforms retain Cargokit's standard directory name.
      - name: Report cargokit build layout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          found=$(find build -type d \( -name cargokit_build -o -name ck \) 2>/dev/null || true)
          if [ -z "$found" ]; then
            echo "No Cargokit build directory under build/ on ${{ runner.os }}."
            exit 0
          fi
          echo "$found" | while read -r dir; do
            du -sh "$dir" 2>/dev/null || echo "$dir"
          done

      - name: Report sccache statistics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### sccache ${{ matrix.platform }}"
            echo '```text'
            sccache --show-stats || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
