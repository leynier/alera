name: Desktop Builds

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

# A newer commit makes the checks for the previous one irrelevant, and superseded
# runs otherwise keep saturating the runner pool for the whole repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ALERA_FLAVOR: release

jobs:
  build:
    name: build ${{ matrix.platform }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          rust: 'true'

      - name: Tune Windows build environment
        if: runner.os == 'Windows'
        uses: ./.github/actions/tune-windows-build

      # Swatinem/rust-cache only covers rust/target, which is the alera-cli
      # sidecar. cargokit compiles alera_native and code_forge into the Flutter
      # build directory instead, so 1.3 GB of release artifacts were rebuilt
      # from scratch on every run. Only the warm-cache workflow saves, so pull
      # requests never write a private copy back.
      - name: Restore cargokit build
        uses: actions/cache/restore@v6
        with:
          path: build/**/cargokit_build
          key: cargokit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-
          restore-keys: |
            cargokit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-
            cargokit-${{ runner.os }}-${{ runner.arch }}-

      - name: Build desktop app
        run: flutter build ${{ matrix.platform }} --release --dart-define=ALERA_FLAVOR=release

      - name: Verify bundled helper and video runtimes
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            macos)
              bundle="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
              ;;
            windows)
              executable="$(find build/windows -type f -name 'Alera.exe' -path '*/Release/*' -print -quit)"
              bundle="$(dirname "$executable")"
              ;;
            linux)
              bundle="build/linux/x64/release/bundle"
              ;;
          esac
          test -d "$bundle" || { echo "::error::Missing desktop bundle for $PLATFORM"; exit 1; }
          dart tool/native_helpers/verify_desktop_runtime_bundle.dart \
            --platform "$PLATFORM" \
            --bundle "$bundle"

      # The cargokit temp directory layout differs per platform and is only
      # confirmed for Linux, so report what was actually produced until the
      # macOS and Windows paths have been observed on a real run.
      - name: Report cargokit build layout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          found=$(find build -type d -name cargokit_build 2>/dev/null || true)
          if [ -z "$found" ]; then
            echo "No cargokit_build directory under build/ on ${{ runner.os }}."
            exit 0
          fi
          echo "$found" | while read -r dir; do
            du -sh "$dir" 2>/dev/null || echo "$dir"
          done
