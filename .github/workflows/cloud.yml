name: Cloud

on:
  workflow_call:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'cloud/**'
      - 'edge/**'
      - 'infra/**'
      - 'tool/cloud/**'
      - '.github/workflows/cloud-deploy.yml'
      - '.github/workflows/cloud.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: alera_cloud_tests
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alera_cloud_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/alera_cloud_tests
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/alera_cloud_tests
    defaults:
      run:
        working-directory: cloud
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: cloud
          shared-key: alera-cloud-tests

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: PostgreSQL Contract Tests
        run: cargo test --workspace -- --ignored --test-threads=1

      - name: Build Container
        run: docker build --file Dockerfile .

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edge
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Type Check
        run: bun run check

      - name: Test
        run: bun test

      - name: Bundle Worker
        run: bunx wrangler deploy --dry-run

      - name: Bundle Relay-Disabled Recovery
        run: ../tool/cloud/deploy_worker_relay_disabled.sh . --dry-run

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.1

      - name: Validate Production Root
        working-directory: infra/production
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false -input=false
          tofu validate

      - name: Validate Bootstrap Root
        working-directory: infra/bootstrap/github
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false -input=false
          tofu validate

      - name: Test Plan Guard
        working-directory: tool/cloud
        run: python3 -m unittest -v test_validate_tofu_plan.py

      - name: Validate Deployment Scripts
        run: bash -n tool/cloud/deploy_worker_relay_disabled.sh tool/cloud/test_verify_production.sh tool/cloud/verify_production.sh tool/cloud/verify_worker_namespace.sh

      - name: Test Production Verifier
        run: bash tool/cloud/test_verify_production.sh

  cloud-ready:
    name: cloud-ready
    if: always()
    needs:
      - backend
      - edge
      - infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require cloud checks
        shell: bash
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          EDGE_RESULT: ${{ needs.edge.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
        run: |
          set -euo pipefail
          failed=0
          for result_name in BACKEND_RESULT EDGE_RESULT INFRASTRUCTURE_RESULT; do
            result="${!result_name}"
            if [ "$result" != "success" ]; then
              echo "::error::${result_name} was ${result}"
              failed=1
            fi
          done
          exit "$failed"
