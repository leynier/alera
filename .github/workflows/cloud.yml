name: Cloud

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'cloud/**'
      - 'edge/**'
      - 'infra/**'
      - '.github/workflows/cloud.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: alera_cloud_tests
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alera_cloud_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/alera_cloud_tests
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/alera_cloud_tests
    defaults:
      run:
        working-directory: cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96'
          components: rustfmt, clippy

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cloud
          shared-key: alera-cloud-tests

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: PostgreSQL Contract Tests
        run: cargo test --workspace -- --ignored --test-threads=1

      - name: Build Container
        run: docker build --file Dockerfile .

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edge
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Type Check
        run: bun run check

      - name: Test
        run: bun test

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.1

      - name: Format
        run: tofu fmt -check -recursive

      - name: Initialize Providers
        run: tofu init -backend=false -input=false

      - name: Validate
        run: tofu validate
