name: Cut Mobile Release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Release kind
        required: true
        type: choice
        default: patch
        options:
          - rc
          - patch
          - minor
          - major
      ref:
        description: Branch, tag, or SHA to release from
        required: false
        type: string
        default: main
      dry_run:
        description: Compute the next version without tagging or publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: mobile-release-cut
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_version: ${{ steps.version.outputs.release_version }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      channel: ${{ steps.version.outputs.channel }}
      should_release: ${{ steps.version.outputs.should_release }}
      release_base_ref: ${{ steps.version.outputs.release_base_ref }}
    steps:
      - name: Checkout ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Compute next mobile version
        id: version
        shell: bash
        env:
          KIND: ${{ inputs.kind }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_BASE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --quiet

          latest_stable="$(git tag --list 'v[0-9]*-mobile' \
            | grep -Ev -- '-rc\.' \
            | sed -E 's/^v//; s/-mobile$//' \
            | sort -V \
            | tail -n 1 || true)"
          if [[ -z "$latest_stable" ]]; then
            latest_stable="0.0.0"
          fi

          bump() {
            node - "$1" "$2" <<'NODE'
          const [version, kind] = process.argv.slice(2);
          const parts = version.split(".").map(Number);
          if (kind === "major") console.log(`${parts[0] + 1}.0.0`);
          else if (kind === "minor") console.log(`${parts[0]}.${parts[1] + 1}.0`);
          else console.log(`${parts[0]}.${parts[1]}.${parts[2] + 1}`);
          NODE
          }

          if [[ "$KIND" == "rc" ]]; then
            artifact_version="$(bump "$latest_stable" patch)"
            highest_rc="$(git tag --list "v${artifact_version}-rc.*-mobile" \
              | sed -E "s/^v${artifact_version//./\\.}-rc\\.([0-9]+)-mobile$/\\1/" \
              | sort -n \
              | tail -n 1 || true)"
            if [[ -z "$highest_rc" ]]; then
              release_version="${artifact_version}-rc.0"
            else
              release_version="${artifact_version}-rc.$((highest_rc + 1))"
            fi
            channel="rc"
          else
            artifact_version="$(bump "$latest_stable" "$KIND")"
            release_version="$artifact_version"
            channel="stable"
          fi

          tag="v${release_version}-mobile"
          build_number="$GITHUB_RUN_NUMBER"
          {
            echo "tag=$tag"
            echo "release_version=$release_version"
            echo "artifact_version=$artifact_version"
            echo "build_number=$build_number"
            echo "channel=$channel"
            echo "release_base_ref=$RELEASE_BASE_REF"
          } >>"$GITHUB_OUTPUT"

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "should_release=false" >>"$GITHUB_OUTPUT"
            echo "Dry run: $tag ($artifact_version+$build_number)"
            exit 0
          fi

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi
          echo "should_release=true" >>"$GITHUB_OUTPUT"

  build_android:
    needs: cut
    if: needs.cut.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout release ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.cut.outputs.release_base_ref }}
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Apply mobile release version locally
        run: dart tool/release/update_mobile_pubspec_version.dart "${{ needs.cut.outputs.artifact_version }}" "${{ needs.cut.outputs.build_number }}"

      - name: Analyze mobile app
        working-directory: mobile
        run: flutter analyze

      - name: Test mobile app
        working-directory: mobile
        run: flutter test

      - name: Build Android release APKs
        working-directory: mobile
        run: |
          set -euo pipefail
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Stage and verify Android release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.cut.outputs.release_version }}
        run: |
          set -euo pipefail
          source_dir="mobile/build/app/outputs/flutter-apk"
          mkdir -p release-assets
          cp "$source_dir/app-release.apk" "release-assets/alera-${RELEASE_VERSION}-android.apk"
          cp "$source_dir/app-arm64-v8a-release.apk" "release-assets/alera-${RELEASE_VERSION}-android-arm64-v8a.apk"
          cp "$source_dir/app-armeabi-v7a-release.apk" "release-assets/alera-${RELEASE_VERSION}-android-armeabi-v7a.apk"
          cp "$source_dir/app-x86_64-release.apk" "release-assets/alera-${RELEASE_VERSION}-android-x86_64.apk"

          for asset in release-assets/*.apk; do
            asset_name="$(basename "$asset")"
            (cd release-assets && sha256sum "$asset_name" >"${asset_name}.sha256")
          done
          (cd release-assets && sha256sum -c ./*.sha256)

      - name: Upload Android release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-android-release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - cut
      - build_android
    if: needs.cut.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.cut.outputs.release_base_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260

      - name: Download Android release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mobile-android-release-assets
          path: release-assets

      - name: Verify complete mobile release
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.cut.outputs.release_version }}
        run: |
          set -euo pipefail
          expected=(
            "alera-${RELEASE_VERSION}-android.apk"
            "alera-${RELEASE_VERSION}-android-arm64-v8a.apk"
            "alera-${RELEASE_VERSION}-android-armeabi-v7a.apk"
            "alera-${RELEASE_VERSION}-android-x86_64.apk"
          )
          for asset in "${expected[@]}"; do
            test -s "release-assets/$asset" || { echo "::error::Missing $asset"; exit 1; }
            test -s "release-assets/$asset.sha256" || { echo "::error::Missing $asset.sha256"; exit 1; }
          done
          actual_count="$(find release-assets -maxdepth 1 -type f | wc -l)"
          if [[ "$actual_count" -ne 8 ]]; then
            echo "::error::Expected 8 release files, found $actual_count."
            find release-assets -maxdepth 1 -type f -print
            exit 1
          fi
          (cd release-assets && sha256sum -c ./*.sha256)

      - name: Create mobile release commit and tag
        id: release_commit
        env:
          TAG: ${{ needs.cut.outputs.tag }}
          ARTIFACT_VERSION: ${{ needs.cut.outputs.artifact_version }}
          BUILD_NUMBER: ${{ needs.cut.outputs.build_number }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --quiet
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dart tool/release/update_mobile_pubspec_version.dart "$ARTIFACT_VERSION" "$BUILD_NUMBER"
          git add mobile/pubspec.yaml
          if git diff --cached --quiet; then
            echo "::notice::mobile/pubspec.yaml already at $ARTIFACT_VERSION+$BUILD_NUMBER; skipping release commit."
          else
            git commit -m "release: $TAG"
          fi
          git tag -a "$TAG" -m "$TAG"
          echo "release_sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Push mobile release refs
        id: push_refs
        env:
          TAG: ${{ needs.cut.outputs.tag }}
        run: |
          set -euo pipefail
          pushed_main=false
          cleanup_failed_push() {
            set +e
            git push origin ":refs/tags/$TAG"
            if [[ "$pushed_main" == "true" ]]; then
              git push --force-with-lease origin HEAD~1:refs/heads/main
            fi
          }
          trap cleanup_failed_push ERR
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [[ "$head_sha" == "$main_sha" ]]; then
            echo "::notice::No release commit was needed; only the mobile tag will be pushed."
          elif [[ "$(git rev-parse HEAD~1)" == "$main_sha" ]]; then
            git push origin "HEAD:refs/heads/main"
            pushed_main=true
          else
            echo "::notice::Release ref is not current origin/main; only the mobile tag will be pushed."
          fi
          git push origin "$TAG"
          trap - ERR
          echo "pushed_main=$pushed_main" >>"$GITHUB_OUTPUT"

      - name: Create draft mobile release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.cut.outputs.tag }}
          CHANNEL: ${{ needs.cut.outputs.channel }}
          ARTIFACT_VERSION: ${{ needs.cut.outputs.artifact_version }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "stable" ]]; then
            previous_tag="$(git tag --list 'v[0-9]*-mobile' \
              | grep -Ev -- '-rc\.' \
              | grep -vx "$TAG" \
              | sort -V \
              | tail -n 1 || true)"
          else
            previous_tag="$(git tag --list "v${ARTIFACT_VERSION}-rc.*-mobile" \
              | grep -vx "$TAG" \
              | sort -V \
              | tail -n 1 || true)"
            if [[ -z "$previous_tag" ]]; then
              previous_tag="$(git tag --list 'v[0-9]*-mobile' \
                | grep -Ev -- '-rc\.' \
                | sort -V \
                | tail -n 1 || true)"
            fi
          fi

          notes_args=(
            --scope mobile
            --repo "$GITHUB_REPOSITORY"
            --tag "$TAG"
            --target "${{ steps.release_commit.outputs.release_sha }}"
            --output release-notes.md
          )
          if [[ -n "$previous_tag" ]]; then
            notes_args+=(--previous-tag "$previous_tag")
          fi
          dart tool/release/generate_release_notes.dart "${notes_args[@]}"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "${{ steps.release_commit.outputs.release_sha }}" \
            --title "Alera ${{ needs.cut.outputs.release_version }} (Android)" \
            --notes-file release-notes.md

      - name: Upload mobile release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.cut.outputs.tag }}
        run: gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Attest mobile release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release-assets/*

      - name: Publish mobile release
        id: publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.cut.outputs.tag }}
          CHANNEL: ${{ needs.cut.outputs.channel }}
        run: |
          set -euo pipefail
          prerelease=false
          if [[ "$CHANNEL" == "rc" ]]; then
            prerelease=true
          fi
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease="$prerelease" \
            --latest=false

      - name: Cleanup pushed mobile release refs on failure
        if: failure() && steps.push_refs.outcome == 'success' && steps.publish_release.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.cut.outputs.tag }}
          PUSHED_MAIN: ${{ steps.push_refs.outputs.pushed_main }}
        run: |
          set +e
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          git push origin ":refs/tags/$TAG"
          if [[ "$PUSHED_MAIN" == "true" ]]; then
            git push --force-with-lease origin HEAD~1:refs/heads/main
          fi
