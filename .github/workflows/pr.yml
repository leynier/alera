name: PR Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# A newer commit makes the checks for the previous one irrelevant, and superseded
# runs otherwise keep saturating the runner pool for the whole repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace

      - name: Format
        run: dart format --set-exit-if-changed lib test integration_test tool

      - name: Max lines ratchet
        run: dart run tool/quality/check_max_lines.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage --exclude-tags golden

      - name: Coverage report
        run: dart run tool/quality/coverage_report.dart --input coverage/lcov.info --min-lines 100 --worst 25

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      # The mobile package overrides xterm to ../third_party/xterm and runs no
      # native asset hooks, so it needs neither the other submodule nor Zig.
      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          working-directory: mobile
          submodules: third_party/xterm
          linux-toolchain: 'false'
          native-assets: 'false'
          preflight: 'false'

      - name: Format
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace

      - name: Golden tests
        run: flutter test --tags golden

  desktop-e2e-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          xvfb: 'true'
          enable-linux-desktop: 'true'
          rust: 'true'

      - name: Desktop E2E
        run: xvfb-run -a flutter test integration_test -d linux -r github

  # Split out of desktop-e2e-linux: the smoke run takes about as long as the
  # integration tests themselves and is continue-on-error, so it can never fail
  # a pull request, yet it was what made that job the critical path.
  perf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          xvfb: 'true'
          enable-linux-desktop: 'true'
          rust: 'true'

      - name: Linux startup performance smoke
        continue-on-error: true
        run: xvfb-run -a dart tool/performance/alera_performance.dart --runs 3 --output .dart_tool/performance-ci

      - name: Upload Linux startup performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-startup-performance
          path: .dart_tool/performance-ci/startup_linux.json
          if-no-files-found: ignore

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          components: rustfmt, clippy

      # A separate shared-key from the build jobs on purpose: this cache holds
      # dev-dependencies and test binaries, which is legitimately different
      # content from what the native build hooks produce.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: alera-tests

      - name: Format
        run: cargo fmt --check
        working-directory: rust

      # --workspace is required because rust/ has a root package (alera_native),
      # so a bare clippy/test would skip the alera-cli member.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust

      - name: Test
        run: cargo test --workspace
        working-directory: rust
