name: PR Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux Flutter dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Patch PDFium podspec
        run: dart tool/ci/patch_pdfium_flutter_podspec.dart

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Cache native assets
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/hooks_runner
            .dart_tool/native_assets
            .dart_tool/native_assets_builder
          key: native-assets-${{ runner.os }}-${{ runner.arch }}-flutter-${{ hashFiles('pubspec.lock', 'third_party/dart_terminal/pkgs/vte/ghostty_vte/third_party/ghostty/build.zig.zon') }}
          restore-keys: |
            native-assets-${{ runner.os }}-${{ runner.arch }}-flutter-

      - name: Native asset preflight
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter test test/unit/native_asset_preflight_test.dart --name "native asset package graph is available"; then
              exit 0
            fi
            echo "Native asset preflight failed on attempt ${attempt}; retrying..."
            sleep $((attempt * 10))
          done
          flutter test test/unit/native_asset_preflight_test.dart --name "native asset package graph is available"

      - name: Format
        run: dart format --set-exit-if-changed lib test integration_test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage --exclude-tags golden

      - name: Coverage report
        run: dart run tool/quality/coverage_report.dart --input coverage/lcov.info --min-lines 65 --worst 25

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux Flutter dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Patch PDFium podspec
        run: dart tool/ci/patch_pdfium_flutter_podspec.dart

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Cache native assets
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/hooks_runner
            .dart_tool/native_assets
            .dart_tool/native_assets_builder
          key: native-assets-${{ runner.os }}-${{ runner.arch }}-golden-${{ hashFiles('pubspec.lock', 'third_party/dart_terminal/pkgs/vte/ghostty_vte/third_party/ghostty/build.zig.zon') }}
          restore-keys: |
            native-assets-${{ runner.os }}-${{ runner.arch }}-golden-

      - name: Native asset preflight
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter test test/unit/native_asset_preflight_test.dart --name "native asset package graph is available"; then
              exit 0
            fi
            echo "Native asset preflight failed on attempt ${attempt}; retrying..."
            sleep $((attempt * 10))
          done
          flutter test test/unit/native_asset_preflight_test.dart --name "native asset package graph is available"

      - name: Golden tests
        run: flutter test --tags golden

  desktop-e2e-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux Flutter dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Patch PDFium podspec
        run: dart tool/ci/patch_pdfium_flutter_podspec.dart

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Cache native assets
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/hooks_runner
            .dart_tool/native_assets
            .dart_tool/native_assets_builder
          key: native-assets-${{ runner.os }}-${{ runner.arch }}-desktop-e2e-${{ hashFiles('pubspec.lock', 'third_party/dart_terminal/pkgs/vte/ghostty_vte/third_party/ghostty/build.zig.zon') }}
          restore-keys: |
            native-assets-${{ runner.os }}-${{ runner.arch }}-desktop-e2e-

      # The Linux build hook compiles the Rust terminal-host sidecar via cargo.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Native asset preflight
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter test test/unit/native_asset_preflight_test.dart --name "native asset package graph is available"; then
              exit 0
            fi
            echo "Native asset preflight failed on attempt ${attempt}; retrying..."
            sleep $((attempt * 10))
          done
          flutter test test/unit/native_asset_preflight_test.dart --name "native asset package graph is available"

      - name: Desktop E2E
        run: xvfb-run -a flutter test integration_test -d linux -r github

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        run: cargo fmt --check
        working-directory: rust

      # --workspace is required because rust/ has a root package (alera_native),
      # so a bare clippy/test would skip the alera-cli member.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust

      - name: Test
        run: cargo test --workspace
        working-directory: rust
