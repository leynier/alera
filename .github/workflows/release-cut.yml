name: Cut Release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Release kind
        required: true
        type: choice
        default: rc
        options:
          - rc
          - patch
          - minor
          - major
      ref:
        description: Branch, tag, or SHA to release from
        required: false
        type: string
        default: main
      dry_run:
        description: Compute the next version without tagging or publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-cut
  cancel-in-progress: false

env:
  ALERA_UPDATE_BASE_URL: https://updates.alera.build
  ALERA_R2_BUCKET: alera-updates
  ALERA_STABLE_RELEASES_TO_KEEP: 5
  ALERA_RC_RELEASES_TO_KEEP: 3
  ALERA_FLAVOR: release

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_version: ${{ steps.version.outputs.release_version }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      channel: ${{ steps.version.outputs.channel }}
      should_release: ${{ steps.version.outputs.should_release }}
      release_base_ref: ${{ steps.version.outputs.release_base_ref }}
    steps:
      - name: Checkout ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Compute next version
        id: version
        shell: bash
        env:
          KIND: ${{ inputs.kind }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_BASE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --quiet

          latest_stable="$(git tag --list 'v[0-9]*' | grep -Ev -- '-rc\.' | sort -V | tail -n 1 || true)"
          latest_stable="${latest_stable#v}"
          if [[ -z "$latest_stable" ]]; then
            latest_stable="0.1.0"
          fi

          bump() {
            node - "$1" "$2" <<'NODE'
          const [version, kind] = process.argv.slice(2);
          const parts = version.split(".").map(Number);
          if (kind === "major") console.log(`${parts[0] + 1}.0.0`);
          else if (kind === "minor") console.log(`${parts[0]}.${parts[1] + 1}.0`);
          else console.log(`${parts[0]}.${parts[1]}.${parts[2] + 1}`);
          NODE
          }

          if [[ "$KIND" == "rc" ]]; then
            artifact_version="$(bump "$latest_stable" patch)"
            highest_rc="$(git tag --list "v${artifact_version}-rc.*" | sed -E "s/^v${artifact_version//./\\.}-rc\\.//" | sort -n | tail -n 1 || true)"
            if [[ -z "$highest_rc" ]]; then
              release_version="${artifact_version}-rc.0"
            else
              release_version="${artifact_version}-rc.$((highest_rc + 1))"
            fi
            channel="rc"
          else
            artifact_version="$(bump "$latest_stable" "$KIND")"
            release_version="$artifact_version"
            channel="stable"
          fi

          tag="v$release_version"
          build_number="$GITHUB_RUN_NUMBER"
          {
            echo "tag=$tag"
            echo "release_version=$release_version"
            echo "artifact_version=$artifact_version"
            echo "build_number=$build_number"
            echo "channel=$channel"
            echo "release_base_ref=$RELEASE_BASE_REF"
          } >>"$GITHUB_OUTPUT"

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "should_release=false" >>"$GITHUB_OUTPUT"
            echo "Dry run: $tag ($artifact_version+$build_number)"
            exit 0
          fi

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi

          echo "should_release=true" >>"$GITHUB_OUTPUT"

  build:
    needs: cut
    if: needs.cut.outputs.should_release == 'true'
    name: build ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.cut.outputs.release_base_ref }}
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux Flutter dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get

      # The native build hooks compile the Rust terminal-host sidecar via cargo.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Apply release version locally
        run: dart tool/release/update_pubspec_version.dart "${{ needs.cut.outputs.artifact_version }}" "${{ needs.cut.outputs.build_number }}"

      - name: Build updater archive
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CHANNEL: ${{ needs.cut.outputs.channel }}
          BASE_URL: ${{ env.ALERA_UPDATE_BASE_URL }}
          RELEASE_PAGE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.cut.outputs.tag }}
        run: |
          set -euo pipefail
          archive_file="app-archive.json"
          if [[ "$CHANNEL" == "rc" ]]; then
            archive_file="app-archive-rc.json"
          fi
          archive_url="${BASE_URL}/${archive_file}"
          dart run desktop_updater:release "$PLATFORM" \
            --dart-define "ALERA_FLAVOR=release" \
            --dart-define "ALERA_UPDATE_CHANNEL=$CHANNEL" \
            --dart-define "ALERA_UPDATE_ARCHIVE_URL=$archive_url" \
            --dart-define "ALERA_RELEASE_PAGE_URL=$RELEASE_PAGE_URL" \
            --dart-define "ALERA_UPDATE_AUTO_INSTALL_ENABLED=false" \
            --dart-define "ALERA_SIGNED_RELEASE=false"
          dart run desktop_updater:archive "$PLATFORM"

      - name: Prepare release and updater artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CHANNEL: ${{ needs.cut.outputs.channel }}
          RELEASE_VERSION: ${{ needs.cut.outputs.release_version }}
          ARTIFACT_VERSION: ${{ needs.cut.outputs.artifact_version }}
          BUILD_NUMBER: ${{ needs.cut.outputs.build_number }}
        run: |
          set -euo pipefail
          app_name="$(grep -E '^name:' pubspec.yaml | awk '{print $2}')"
          updater_dir="dist/${BUILD_NUMBER}/${ARTIFACT_VERSION}+${BUILD_NUMBER}-${PLATFORM}"
          bundle_dir="dist/${BUILD_NUMBER}/${app_name}-${ARTIFACT_VERSION}+${BUILD_NUMBER}-${PLATFORM}"
          if [[ ! -d "$updater_dir" ]]; then
            echo "::error::Missing updater archive $updater_dir"
            find dist -maxdepth 3 -type d -print || true
            exit 1
          fi
          if [[ ! -d "$bundle_dir" ]]; then
            echo "::error::Missing release bundle $bundle_dir"
            find dist -maxdepth 3 -type d -print || true
            exit 1
          fi
          mkdir -p "pages/updates/${CHANNEL}/${ARTIFACT_VERSION}+${BUILD_NUMBER}-${PLATFORM}" release-assets
          cp -R "$updater_dir/." "pages/updates/${CHANNEL}/${ARTIFACT_VERSION}+${BUILD_NUMBER}-${PLATFORM}/"
          if [[ "$PLATFORM" == "macos" && -d "$bundle_dir/alera.app" ]]; then
            # desktop_updater names the bundle after the lowercase pubspec
            # package name; the release display name is Alera (see
            # lib/src/core/build_flavor.dart). Runs after the updater archive
            # step (which reads alera.app) and before the tarball is created.
            # The runner filesystem is case-insensitive, so route through a
            # distinct temp name; a direct case-only mv can be a no-op (BSD) or
            # a "same file" error (GNU) that would abort the job under set -e.
            mv "$bundle_dir/alera.app" "$bundle_dir/.Alera.app.tmp"
            mv "$bundle_dir/.Alera.app.tmp" "$bundle_dir/Alera.app"
          fi
          tar -czf "release-assets/alera-${RELEASE_VERSION}-${PLATFORM}.tar.gz" -C "$bundle_dir" .

      - name: Upload updater artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.platform }}
          path: pages/
          retention-days: 1
          if-no-files-found: error

      - name: Upload release asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs:
      - cut
      - build
    if: needs.cut.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.cut.outputs.release_base_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download updater artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: public
          merge-multiple: true

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Preserve existing update indexes
        run: |
          set -euo pipefail
          mkdir -p public
          preserve_index() {
            local file="$1"
            local url="${ALERA_UPDATE_BASE_URL}/${file}"
            local status
            status="$(curl -sSLo "public/${file}" -w "%{http_code}" "$url" || true)"
            if [[ "$status" == "200" ]]; then
              return 0
            fi
            rm -f "public/${file}"
            if [[ "$status" == "404" ]]; then
              echo "No existing ${file} index found."
              return 0
            fi
            echo "::error::Failed to preserve existing ${file} index from ${url}; HTTP status ${status}."
            exit 1
          }
          preserve_index app-archive.json
          preserve_index app-archive-rc.json

      - name: Generate and verify app archive
        env:
          CHANNEL: ${{ needs.cut.outputs.channel }}
          ALERA_RELEASE_VERSION: ${{ needs.cut.outputs.release_version }}
          ALERA_ARTIFACT_VERSION: ${{ needs.cut.outputs.artifact_version }}
          ALERA_RELEASE_BUILD_NUMBER: ${{ needs.cut.outputs.build_number }}
          ALERA_UPDATE_BASE_URL: ${{ env.ALERA_UPDATE_BASE_URL }}
          ALERA_UPDATE_PATH_PREFIX: updates/${{ needs.cut.outputs.channel }}
        run: |
          archive_file="app-archive.json"
          if [[ "$CHANNEL" == "rc" ]]; then
            archive_file="app-archive-rc.json"
          fi
          dart tool/release/build_app_archive.dart "public/$archive_file"
          dart tool/release/verify_app_archive.dart "public/$archive_file"
          echo "ALERA_ARCHIVE_FILE=$archive_file" >>"$GITHUB_ENV"

      - name: Ensure AWS CLI
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --user awscli
            echo "$HOME/.local/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          aws --version

      - name: Verify R2 deployment prerequisites
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID:-}" || { echo "::error::R2_ACCESS_KEY_ID secret is missing."; exit 1; }
          test -n "${AWS_SECRET_ACCESS_KEY:-}" || { echo "::error::R2_SECRET_ACCESS_KEY secret is missing."; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing."; exit 1; }
          aws s3 ls "s3://${ALERA_R2_BUCKET}" --endpoint-url "$R2_ENDPOINT" >/dev/null

      - name: Create release commit and tag
        id: release_commit
        env:
          TAG: ${{ needs.cut.outputs.tag }}
          ARTIFACT_VERSION: ${{ needs.cut.outputs.artifact_version }}
          BUILD_NUMBER: ${{ needs.cut.outputs.build_number }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --quiet
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          dart tool/release/update_pubspec_version.dart "$ARTIFACT_VERSION" "$BUILD_NUMBER"
          git add pubspec.yaml
          git commit -m "release: $TAG"
          git tag -a "$TAG" -m "$TAG"
          echo "release_sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Push release refs
        id: push_refs
        env:
          TAG: ${{ needs.cut.outputs.tag }}
        run: |
          set -euo pipefail
          pushed_main=false
          cleanup_failed_push() {
            set +e
            git push origin ":refs/tags/$TAG"
            if [[ "$pushed_main" == "true" ]]; then
              git push --force-with-lease origin HEAD~1:refs/heads/main
            fi
          }
          trap cleanup_failed_push ERR
          current_sha="$(git rev-parse HEAD~1)"
          main_sha="$(git rev-parse origin/main)"
          if [[ "$current_sha" == "$main_sha" ]]; then
            git push origin "HEAD:refs/heads/main"
            pushed_main=true
          else
            echo "::notice::Release ref is not current origin/main; only the tag will be pushed."
          fi
          git push origin "$TAG"
          trap - ERR
          echo "pushed_main=$pushed_main" >>"$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.cut.outputs.tag }}
          CHANNEL: ${{ needs.cut.outputs.channel }}
        run: |
          set -euo pipefail
          # Stable releases must diff against the previous stable tag; otherwise
          # GitHub auto-detection scopes them against the last RC of the cycle,
          # leaving the notes nearly empty. RC releases keep auto-detection so
          # each RC is scoped against the previous RC (or the last stable for rc.0).
          if [[ "$CHANNEL" == "stable" ]]; then
            prev_stable="$(git tag --list 'v[0-9]*' \
              | grep -Ev -- '-rc\.' \
              | grep -vx "$TAG" \
              | sort -V \
              | tail -n 1 || true)"
          else
            prev_stable=""
          fi

          args=(
            "$TAG"
            --repo "$GITHUB_REPOSITORY"
            --draft
            --target "${{ steps.release_commit.outputs.release_sha }}"
            --title "$TAG"
            --generate-notes
          )
          if [[ -n "$prev_stable" ]]; then
            args+=(--notes-start-tag "$prev_stable")
          fi

          gh release create "${args[@]}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.cut.outputs.tag }}
        run: gh release upload "$TAG" release-assets/* "public/$ALERA_ARCHIVE_FILE" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish release
        id: publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.cut.outputs.tag }}
          CHANNEL: ${{ needs.cut.outputs.channel }}
        run: |
          prerelease=false
          if [[ "$CHANNEL" == "rc" ]]; then
            prerelease=true
          fi
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease="$prerelease"

      - name: Publish update archive to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          aws s3 sync public/updates "s3://${ALERA_R2_BUCKET}/updates" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable"
          for archive_file in app-archive.json app-archive-rc.json; do
            if [[ -f "public/$archive_file" ]]; then
              aws s3 cp "public/$archive_file" "s3://${ALERA_R2_BUCKET}/$archive_file" \
                --endpoint-url "$R2_ENDPOINT" \
                --cache-control "no-cache"
            fi
          done

      - name: Cleanup old R2 update folders
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail

          protected_file="$RUNNER_TEMP/alera-r2-protected-prefixes.txt"
          node <<'NODE' >"$protected_file"
          const fs = require('node:fs');
          const protectedPrefixes = new Set();
          for (const file of ['public/app-archive.json', 'public/app-archive-rc.json']) {
            if (!fs.existsSync(file)) continue;
            const archive = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const item of archive.items ?? []) {
              if (typeof item.url !== 'string') continue;
              const pathname = new URL(item.url).pathname.replace(/^\/+/, '');
              const parts = pathname.split('/');
              if (parts.length >= 3 && parts[0] === 'updates') {
                protectedPrefixes.add(parts.slice(0, 3).join('/'));
              }
            }
          }
          for (const prefix of [...protectedPrefixes].sort()) {
            console.log(prefix);
          }
          NODE

          cleanup_channel() {
            local channel="$1"
            local keep_count="$2"
            local prefixes_file="$RUNNER_TEMP/alera-r2-${channel}-prefixes.txt"
            local raw_prefixes_file="$RUNNER_TEMP/alera-r2-${channel}-raw-prefixes.txt"
            local delete_file="$RUNNER_TEMP/alera-r2-${channel}-delete.txt"

            if aws s3 ls "s3://${ALERA_R2_BUCKET}/updates/${channel}/" \
              --endpoint-url "$R2_ENDPOINT" >"$raw_prefixes_file"; then
              awk '$1 == "PRE" { sub(/\/$/, "", $2); print $2 }' "$raw_prefixes_file" >"$prefixes_file"
            else
              : >"$prefixes_file"
            fi

            node - "$channel" "$keep_count" "$prefixes_file" "$protected_file" <<'NODE' >"$delete_file"
          const fs = require('node:fs');
          const [channel, keepCountRaw, prefixesFile, protectedFile] = process.argv.slice(2);
          const keepCount = Number.parseInt(keepCountRaw, 10);
          const prefixes = fs.existsSync(prefixesFile)
            ? fs.readFileSync(prefixesFile, 'utf8').split(/\r?\n/).filter(Boolean)
            : [];
          const protectedPrefixes = new Set(
            fs.existsSync(protectedFile)
              ? fs.readFileSync(protectedFile, 'utf8').split(/\r?\n/).filter(Boolean)
              : [],
          );
          const platformSuffix = /-(macos|windows|linux)$/;
          const groupFor = (prefix) => prefix.replace(platformSuffix, '');
          const buildNumberFor = (group) => {
            const match = group.match(/\+(\d+)$/);
            return match ? Number.parseInt(match[1], 10) : 0;
          };
          const groups = [...new Set(prefixes.map(groupFor))].sort((left, right) => {
            const buildDiff = buildNumberFor(left) - buildNumberFor(right);
            return buildDiff === 0 ? left.localeCompare(right) : buildDiff;
          });
          const retainedGroups = new Set(groups.slice(Math.max(0, groups.length - keepCount)));
          for (const prefix of prefixes) {
            const fullPrefix = `updates/${channel}/${prefix}`;
            if (!retainedGroups.has(groupFor(prefix)) && !protectedPrefixes.has(fullPrefix)) {
              console.log(fullPrefix);
            }
          }
          NODE

            while IFS= read -r prefix; do
              [[ -n "$prefix" ]] || continue
              aws s3 rm "s3://${ALERA_R2_BUCKET}/${prefix}" \
                --endpoint-url "$R2_ENDPOINT" \
                --recursive
            done <"$delete_file"
          }

          cleanup_channel stable "$ALERA_STABLE_RELEASES_TO_KEEP"
          cleanup_channel rc "$ALERA_RC_RELEASES_TO_KEEP"

      - name: Cleanup pushed release refs on pre-publish failure
        if: failure() && steps.push_refs.outcome == 'success' && steps.publish_release.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.cut.outputs.tag }}
          PUSHED_MAIN: ${{ steps.push_refs.outputs.pushed_main }}
        run: |
          set +e
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          git push origin ":refs/tags/$TAG"
          if [[ "$PUSHED_MAIN" == "true" ]]; then
            git push --force-with-lease origin HEAD~1:refs/heads/main
          fi
