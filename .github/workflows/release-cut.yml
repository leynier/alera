name: Cut Release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Release kind
        required: true
        type: choice
        default: rc
        options:
          - rc
          - patch
          - minor
          - major
      ref:
        description: Branch, tag, or SHA to release from
        required: false
        type: string
        default: main
      dry_run:
        description: Compute the next version without tagging or publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-cut
  cancel-in-progress: false

env:
  ALERA_UPDATE_BASE_URL: https://leynier.github.io/alera

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_version: ${{ steps.version.outputs.release_version }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      channel: ${{ steps.version.outputs.channel }}
      should_release: ${{ steps.version.outputs.should_release }}
      release_base_ref: ${{ steps.version.outputs.release_base_ref }}
    steps:
      - name: Checkout ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Compute next version
        id: version
        shell: bash
        env:
          KIND: ${{ inputs.kind }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_BASE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --quiet

          latest_stable="$(git tag --list 'v[0-9]*' | grep -Ev -- '-rc\.' | sort -V | tail -n 1 || true)"
          latest_stable="${latest_stable#v}"
          if [[ -z "$latest_stable" ]]; then
            latest_stable="0.1.0"
          fi

          bump() {
            node -e '
              const [version, kind] = process.argv.slice(1);
              const parts = version.split(".").map(Number);
              if (kind === "major") console.log(`${parts[0] + 1}.0.0`);
              else if (kind === "minor") console.log(`${parts[0]}.${parts[1] + 1}.0`);
              else console.log(`${parts[0]}.${parts[1]}.${parts[2] + 1}`);
            ' "$1" "$2"
          }

          if [[ "$KIND" == "rc" ]]; then
            artifact_version="$(bump "$latest_stable" patch)"
            highest_rc="$(git tag --list "v${artifact_version}-rc.*" | sed -E "s/^v${artifact_version//./\\.}-rc\\.//" | sort -n | tail -n 1 || true)"
            if [[ -z "$highest_rc" ]]; then
              release_version="${artifact_version}-rc.0"
            else
              release_version="${artifact_version}-rc.$((highest_rc + 1))"
            fi
            channel="rc"
          else
            artifact_version="$(bump "$latest_stable" "$KIND")"
            release_version="$artifact_version"
            channel="stable"
          fi

          tag="v$release_version"
          build_number="$GITHUB_RUN_NUMBER"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "release_version=$release_version" >>"$GITHUB_OUTPUT"
          echo "artifact_version=$artifact_version" >>"$GITHUB_OUTPUT"
          echo "build_number=$build_number" >>"$GITHUB_OUTPUT"
          echo "channel=$channel" >>"$GITHUB_OUTPUT"
          echo "release_base_ref=$RELEASE_BASE_REF" >>"$GITHUB_OUTPUT"

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "should_release=false" >>"$GITHUB_OUTPUT"
            echo "Dry run: $tag ($artifact_version+$build_number)"
            exit 0
          fi

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi

          echo "should_release=true" >>"$GITHUB_OUTPUT"

  build:
    needs: cut
    if: needs.cut.outputs.should_release == 'true'
    name: build ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.cut.outputs.release_base_ref }}
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux Flutter dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Apply release version locally
        run: dart tool/release/update_pubspec_version.dart "${{ needs.cut.outputs.artifact_version }}" "${{ needs.cut.outputs.build_number }}"

      - name: Build updater archive
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CHANNEL: ${{ needs.cut.outputs.channel }}
          BASE_URL: ${{ env.ALERA_UPDATE_BASE_URL }}
          RELEASE_PAGE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.cut.outputs.tag }}
        run: |
          set -euo pipefail
          archive_file="app-archive.json"
          if [[ "$CHANNEL" == "rc" ]]; then
            archive_file="app-archive-rc.json"
          fi
          archive_url="${BASE_URL}/${archive_file}"
          dart run desktop_updater:release "$PLATFORM" \
            --dart-define "ALERA_UPDATE_CHANNEL=$CHANNEL" \
            --dart-define "ALERA_UPDATE_ARCHIVE_URL=$archive_url" \
            --dart-define "ALERA_RELEASE_PAGE_URL=$RELEASE_PAGE_URL" \
            --dart-define "ALERA_UPDATE_AUTO_INSTALL_ENABLED=false" \
            --dart-define "ALERA_SIGNED_RELEASE=false"
          dart run desktop_updater:archive "$PLATFORM"

      - name: Prepare release and pages artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ needs.cut.outputs.release_version }}
          ARTIFACT_VERSION: ${{ needs.cut.outputs.artifact_version }}
          BUILD_NUMBER: ${{ needs.cut.outputs.build_number }}
        run: |
          set -euo pipefail
          app_name="$(grep -E '^name:' pubspec.yaml | awk '{print $2}')"
          updater_dir="dist/${BUILD_NUMBER}/${ARTIFACT_VERSION}+${BUILD_NUMBER}-${PLATFORM}"
          bundle_dir="dist/${BUILD_NUMBER}/${app_name}-${ARTIFACT_VERSION}+${BUILD_NUMBER}-${PLATFORM}"
          if [[ ! -d "$updater_dir" ]]; then
            echo "::error::Missing updater archive $updater_dir"
            find dist -maxdepth 3 -type d -print || true
            exit 1
          fi
          if [[ ! -d "$bundle_dir" ]]; then
            echo "::error::Missing release bundle $bundle_dir"
            find dist -maxdepth 3 -type d -print || true
            exit 1
          fi
          mkdir -p "pages/updates/${ARTIFACT_VERSION}+${BUILD_NUMBER}-${PLATFORM}" release-assets
          cp -R "$updater_dir/." "pages/updates/${ARTIFACT_VERSION}+${BUILD_NUMBER}-${PLATFORM}/"
          tar -czf "release-assets/alera-${RELEASE_VERSION}-${PLATFORM}.tar.gz" -C "$bundle_dir" .

      - name: Upload pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-${{ matrix.platform }}
          path: pages/
          retention-days: 1
          if-no-files-found: error

      - name: Upload release asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs:
      - cut
      - build
    if: needs.cut.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.cut.outputs.release_base_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download pages artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pages-*
          path: public
          merge-multiple: true

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Preserve existing update indexes
        run: |
          set -euo pipefail
          mkdir -p public
          preserve_index() {
            local file="$1"
            local url="${ALERA_UPDATE_BASE_URL}/${file}"
            local status
            status="$(curl -sSLo "public/${file}" -w "%{http_code}" "$url" || true)"
            if [[ "$status" == "200" ]]; then
              return 0
            fi
            rm -f "public/${file}"
            if [[ "$status" == "404" ]]; then
              echo "No existing ${file} index found."
              return 0
            fi
            echo "::error::Failed to preserve existing ${file} index from ${url}; HTTP status ${status}."
            exit 1
          }
          preserve_index app-archive.json
          preserve_index app-archive-rc.json

      - name: Generate and verify app archive
        env:
          CHANNEL: ${{ needs.cut.outputs.channel }}
          ALERA_RELEASE_VERSION: ${{ needs.cut.outputs.release_version }}
          ALERA_ARTIFACT_VERSION: ${{ needs.cut.outputs.artifact_version }}
          ALERA_RELEASE_BUILD_NUMBER: ${{ needs.cut.outputs.build_number }}
          ALERA_UPDATE_BASE_URL: ${{ env.ALERA_UPDATE_BASE_URL }}
        run: |
          archive_file="app-archive.json"
          if [[ "$CHANNEL" == "rc" ]]; then
            archive_file="app-archive-rc.json"
          fi
          dart tool/release/build_app_archive.dart "public/$archive_file"
          dart tool/release/verify_app_archive.dart "public/$archive_file"
          echo "ALERA_ARCHIVE_FILE=$archive_file" >>"$GITHUB_ENV"

      - name: Create release commit and tag
        id: release_commit
        env:
          TAG: ${{ needs.cut.outputs.tag }}
          ARTIFACT_VERSION: ${{ needs.cut.outputs.artifact_version }}
          BUILD_NUMBER: ${{ needs.cut.outputs.build_number }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --quiet
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          dart tool/release/update_pubspec_version.dart "$ARTIFACT_VERSION" "$BUILD_NUMBER"
          git add pubspec.yaml
          git commit -m "release: $TAG"
          git tag -a "$TAG" -m "$TAG"
          echo "release_sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Push release refs
        id: push_refs
        env:
          TAG: ${{ needs.cut.outputs.tag }}
        run: |
          set -euo pipefail
          pushed_main=false
          cleanup_failed_push() {
            set +e
            git push origin ":refs/tags/$TAG"
            if [[ "$pushed_main" == "true" ]]; then
              git push --force-with-lease origin HEAD~1:refs/heads/main
            fi
          }
          trap cleanup_failed_push ERR
          current_sha="$(git rev-parse HEAD~1)"
          main_sha="$(git rev-parse origin/main)"
          if [[ "$current_sha" == "$main_sha" ]]; then
            git push origin "HEAD:refs/heads/main"
            pushed_main=true
          else
            echo "::notice::Release ref is not current origin/main; only the tag will be pushed."
          fi
          git push origin "$TAG"
          trap - ERR
          echo "pushed_main=$pushed_main" >>"$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.cut.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "${{ steps.release_commit.outputs.release_sha }}" \
            --title "$TAG" \
            --notes "Alera $TAG"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.cut.outputs.tag }}
        run: gh release upload "$TAG" release-assets/* "public/$ALERA_ARCHIVE_FILE" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish release
        id: publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.cut.outputs.tag }}
          CHANNEL: ${{ needs.cut.outputs.channel }}
        run: |
          prerelease=false
          if [[ "$CHANNEL" == "rc" ]]; then
            prerelease=true
          fi
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease="$prerelease"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Cleanup pushed release refs on pre-publish failure
        if: failure() && steps.push_refs.outcome == 'success' && steps.publish_release.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.cut.outputs.tag }}
          PUSHED_MAIN: ${{ steps.push_refs.outputs.pushed_main }}
        run: |
          set +e
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          git push origin ":refs/tags/$TAG"
          if [[ "$PUSHED_MAIN" == "true" ]]; then
            git push --force-with-lease origin HEAD~1:refs/heads/main
          fi
