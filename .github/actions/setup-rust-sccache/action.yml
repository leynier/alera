name: Setup Rust and sccache
description: >-
  Installs Alera's pinned Rust toolchain and configures sccache with an optional
  dedicated Cloudflare R2 backend.

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
      with:
        toolchain: "1.98.0"
        components: rustfmt, clippy

    - name: Install sccache
      continue-on-error: true
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.15.0
        disable_annotations: true

    - name: Configure sccache
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v sccache >/dev/null 2>&1; then
          echo "::warning::sccache could not be installed; continuing without a Rust compiler cache."
          exit 0
        fi

        {
          echo "RUSTC_WRAPPER=sccache"
          echo "CARGO_INCREMENTAL=0"
          echo "SCCACHE_BASEDIRS=$GITHUB_WORKSPACE"
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
          echo "SCCACHE_ERROR_LOG=$RUNNER_TEMP/sccache-error.log"
        } >>"$GITHUB_ENV"

        required=(
          ALERA_SCCACHE_R2_ACCOUNT_ID
          ALERA_SCCACHE_R2_BUCKET
          ALERA_SCCACHE_R2_ACCESS_KEY_ID
          ALERA_SCCACHE_R2_SECRET_ACCESS_KEY
        )
        missing=()
        for name in "${required[@]}"; do
          if [[ -z "${!name:-}" ]]; then
            missing+=("$name")
          fi
        done
        if ((${#missing[@]} > 0)); then
          echo "::warning::sccache R2 is not fully configured (${missing[*]}); using the runner-local cache."
          exit 0
        fi

        export SCCACHE_BUCKET="$ALERA_SCCACHE_R2_BUCKET"
        export SCCACHE_ENDPOINT="https://$ALERA_SCCACHE_R2_ACCOUNT_ID.r2.cloudflarestorage.com"
        export SCCACHE_REGION=auto
        export SCCACHE_S3_KEY_PREFIX=alera/rust-v1
        export AWS_ACCESS_KEY_ID="$ALERA_SCCACHE_R2_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$ALERA_SCCACHE_R2_SECRET_ACCESS_KEY"
        if sccache --start-server; then
          {
            echo "SCCACHE_BUCKET=$SCCACHE_BUCKET"
            echo "SCCACHE_ENDPOINT=$SCCACHE_ENDPOINT"
            echo "SCCACHE_REGION=$SCCACHE_REGION"
            echo "SCCACHE_S3_KEY_PREFIX=$SCCACHE_S3_KEY_PREFIX"
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
          } >>"$GITHUB_ENV"
          exit 0
        fi

        echo "::warning::sccache could not authenticate to R2; using the runner-local cache."
        unset SCCACHE_BUCKET SCCACHE_ENDPOINT SCCACHE_REGION
        unset SCCACHE_S3_KEY_PREFIX AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
        sccache --start-server
