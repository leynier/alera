name: Setup Flutter workspace
description: >-
  Prepares an Alera CI job: required submodules, Flutter, the Linux desktop
  toolchain, Zig, the shared native asset cache, the pinned Rust toolchain and
  the native asset preflight, in the order .github/AGENTS.md requires.

inputs:
  working-directory:
    description: Directory used for pub get and later Flutter commands.
    required: false
    default: .
  submodules:
    description: Space separated submodule paths, or 'none' to skip the step.
    required: false
    default: third_party/xterm third_party/dart_terminal
  linux-toolchain:
    description: Install the Linux desktop build dependencies on Linux runners.
    required: false
    default: 'true'
  xvfb:
    description: Also install xvfb, for the Linux desktop integration tests.
    required: false
    default: 'false'
  extra-linux-packages:
    description: Additional apt packages appended to the Linux toolchain install.
    required: false
    default: ''
  enable-linux-desktop:
    description: Run `flutter config --enable-linux-desktop`.
    required: false
    default: 'false'
  native-assets:
    description: >-
      Set up Zig, restore the shared native asset cache and apply the temporary
      native asset CI workarounds. Required for any job that runs build hooks.
    required: false
    default: 'true'
  preflight:
    description: Run the native asset preflight before longer test/build commands.
    required: false
    default: 'true'
  rust:
    description: >-
      Set up the pinned Rust toolchain and sccache. Required for
      any job that builds the desktop app or runs the Linux integration tests,
      because the native build hooks compile the Rust sidecar via cargo.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Before dependency resolution: pubspec.yaml overrides point at these paths.
    - name: Initialize required submodules
      if: inputs.submodules != 'none'
      uses: ./.github/actions/init-required-submodules
      with:
        paths: ${{ inputs.submodules }}

    # Pinned rather than `channel: stable`, so a Flutter release does not
    # invalidate the SDK cache for every job on every platform at once,
    # including the warm cache on main.
    - name: Setup Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: 3.44.8
        channel: stable
        cache: true

    - name: Install Linux Flutter dependencies
      if: runner.os == 'Linux' && inputs.linux-toolchain == 'true'
      shell: bash
      run: |
        set -euo pipefail
        packages="clang libclang-dev cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libjson-glib-dev libsecret-1-dev libsqlite3-dev libssl-dev libepoxy-dev libmpv-dev libvulkan-dev glslc"
        if [ "${{ inputs.xvfb }}" = "true" ]; then
          packages="${packages} xvfb"
        fi
        sudo apt-get update
        sudo apt-get install -y ${packages} ${{ inputs.extra-linux-packages }}
        echo "VULKAN_SDK=/usr" >> "$GITHUB_ENV"

    - name: Install libclang on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        brew install llvm
        echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

    - name: Install LLVM on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install llvm --no-progress --yes
        "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    # GitHub-hosted Windows runners fail WinGet's Vulkan package lookup
    # with APPINSTALLER_CLI_ERROR_SOURCE_DATA_MISSING (-1978335217). Install
    # the pinned LunarG SDK from the official installer and pin its SHA-256.
    - name: Install Vulkan SDK on Windows
      if: runner.os == 'Windows' && inputs.rust == 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $version = '1.4.350.0'
        $expectedHash = '855b27ba05d2d8119c5114c5d4ff870ca38f2c632b11e1bb9923b9b7e6ecfe7b'
        $sdk = "C:\VulkanSDK\$version"
        $lib = Join-Path $sdk 'Lib\vulkan-1.lib'
        $glslc = Join-Path $sdk 'Bin\glslc.exe'
        if (-not ((Test-Path -LiteralPath $lib) -and (Test-Path -LiteralPath $glslc))) {
          $installer = Join-Path $env:RUNNER_TEMP "vulkansdk-windows-X64-$version.exe"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          & curl.exe --fail --location --retry 5 --retry-all-errors --output $installer $url
          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK download failed with code $LASTEXITCODE."
          }
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Vulkan SDK installer hash mismatch: expected $expectedHash, got $actualHash."
          }
          $process = Start-Process -FilePath $installer -ArgumentList @(
            '--root', $sdk,
            '--accept-licenses',
            '--default-answer',
            '--confirm-command',
            'install'
          ) -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "Vulkan SDK installation failed with code $($process.ExitCode)."
          }
        }
        if (-not ((Test-Path -LiteralPath $lib) -and (Test-Path -LiteralPath $glslc))) {
          throw "Vulkan SDK $version is incomplete at $sdk."
        }
        "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Enable Linux desktop
      if: inputs.enable-linux-desktop == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter config --enable-linux-desktop

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter pub get

    - name: Setup Zig
      if: inputs.native-assets == 'true'
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    # One key per runner OS/arch. The cache is byte-identical between jobs, and
    # the matrix context is deliberately unavailable here, so it cannot drift
    # back into a namespace per job or per platform.
    - name: Cache native assets
      if: inputs.native-assets == 'true'
      uses: actions/cache@v6
      with:
        path: |
          .dart_tool/hooks_runner
          .dart_tool/native_assets
          .dart_tool/native_assets_builder
        key: native-assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'third_party/dart_terminal/pkgs/vte/ghostty_vte/third_party/ghostty/build.zig.zon') }}
        restore-keys: |
          native-assets-${{ runner.os }}-${{ runner.arch }}-

    - name: Patch native asset CI workarounds
      if: inputs.native-assets == 'true'
      shell: bash
      run: dart tool/ci/patch_native_asset_ci_workarounds.dart

    # macOS has no portable_pty prebuilt in the package graph, so it has to be
    # fetched before the preflight can succeed.
    - name: Setup portable PTY prebuilt
      if: runner.os == 'macOS' && inputs.native-assets == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if dart run portable_pty:setup --platform macos-arm64; then
            exit 0
          fi
          echo "portable_pty setup failed on attempt ${attempt}; retrying..."
          sleep $((attempt * 10))
        done
        dart run portable_pty:setup --platform macos-arm64

    # Before the preflight and before any Flutter build: the native build hooks
    # compile the Rust terminal-host sidecar (alera-cli) and the
    # flutter_rust_bridge library (alera_native) via cargo.
    - name: Setup Rust and sccache
      if: inputs.rust == 'true'
      uses: ./.github/actions/setup-rust-sccache

    # Keeps clean runners resilient when the ghostty_vte, PDFium or portable_pty
    # prebuilt downloads are missing or transiently unavailable.
    - name: Native asset preflight
      if: inputs.native-assets == 'true' && inputs.preflight == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if flutter test test/unit/native_asset_preflight_test.dart --name "native asset package graph is available"; then
            exit 0
          fi
          echo "Native asset preflight failed on attempt ${attempt}; retrying..."
          sleep $((attempt * 10))
        done
        flutter test test/unit/native_asset_preflight_test.dart --name "native asset package graph is available"
