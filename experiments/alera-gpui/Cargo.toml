[package]
name = "alera-gpui"
version = "0.1.0"
edition = "2021"
description = "Linux-first GPUI proof of concept for the Alera desktop client."
publish = false
build = "build.rs"

[features]
default = ["wayland"]
wayland = ["gpui/wayland"]
x11 = ["gpui/x11"]

[dependencies]
alera-native = { package = "alera_native", path = "../../rust" }
alera-core = { path = "../../rust/alera-core", features = ["async-process"] }
alera-runtime-client = { path = "../../rust/alera-runtime-client" }
alacritty_terminal = "0.26"
anyhow = "1"
async-channel = "2"
base64 = "0.23"
chrono = "0.4"
dirs = "6"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
gpui-component = { version = "=0.5.1", features = ["tree-sitter-languages"] }
libloading = "0.8"
regex = "1"
rust-embed = { version = "8.12", features = ["debug-embed"] }
qrcode = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
sysinfo = "0.31"
tokio = { version = "1", features = ["rt-multi-thread"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
debug = true
