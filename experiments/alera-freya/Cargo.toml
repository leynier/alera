[package]
name = "alera-freya"
version = "0.1.0"
edition = "2024"
publish = false
description = "Freya desktop client for Alera, introduced in parallel with GPUI."

[dependencies]
async-io = "2"
alera-desktop-core = { path = "../../rust/alera-desktop-core" }
base64 = "0.22"
blocking = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
include_dir = "0.7"
open = "5"
qrcode = "0.14"
rfd = "0.17"
freya = { git = "https://github.com/marc2332/freya", tag = "v0.5.0-rc.1", default-features = false, features = [
    "winit",
    "icons-lucide",
    "radio",
    "titlebar",
    "code-editor",
    "markdown-code-editor",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter-json = "0.24.8"
uuid = { version = "1", features = ["v4"] }
zip = { version = "5", default-features = false, features = ["deflate"] }

[dev-dependencies]
freya-testing = { git = "https://github.com/marc2332/freya", tag = "v0.5.0-rc.1" }

[profile.release]
debug = true
