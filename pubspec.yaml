name: alera
description: "Alera desktop agentic development environment for workspace terminals"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  args: ^2.7.0
  file_selector: ^1.1.0
  flutter_riverpod: ^3.3.1
  logging: ^1.3.0
  path: ^1.9.1
  google_fonts: ^8.1.0
  uuid: ^4.5.3
  path_provider: ^2.1.5
  ghostty_vte_flutter: ^0.1.3
  ffi: ^2.2.0
  portable_pty: ^0.0.5
  xterm: ^4.0.0
  desktop_updater: ^1.4.0
  http: ^1.6.0
  package_info_plus: ^10.1.0
  url_launcher: ^6.3.2
  flutter_colorpicker: ^1.1.0
  flutter_svg: ^2.3.0
  wakelock_plus: ^1.5.0
  riverpod_annotation: ^4.0.2
  dart_mappable: ^4.8.0
  drift: ^2.33.0
  meta: ^1.18.0
  sqlite3: ^3.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  flutter_local_notifications: ^21.0.0
  window_manager: ^0.5.1
  crypto: ^3.0.6
dev_dependencies:
  alchemist: ^0.14.0
  build_runner: ^2.15.0
  dart_mappable_builder: ^4.8.0
  drift_dev: ^2.33.0
  file_selector_platform_interface: ^2.7.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  riverpod_generator: ^4.0.4-dev.1
  riverpod_lint: ^3.1.4-dev.1
  url_launcher_platform_interface: ^2.3.2

dependency_overrides:
  ghostty_vte:
    path: third_party/dart_terminal/pkgs/vte/ghostty_vte
  # Keeps local terminal fixes pinned while upstream PRs are reviewed.
  xterm:
    path: third_party/xterm

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/logo/alera-logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/logo/alera-logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/alera-logo.png
    - assets/logo/alera-logo-white.png
    - assets/agents/
