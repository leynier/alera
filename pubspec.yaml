name: alera
description: "Alera desktop orchestrator for Codex app-server"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  drift: ^2.29.0
  file_selector: ^1.0.3
  flutter_pty: any
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^3.1.0
  go_router: ^16.2.1
  json_annotation: ^4.9.0
  logging: ^1.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  riverpod_annotation: ^3.0.3
  shared_preferences: ^2.5.3
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.41
  uuid: ^4.5.1
  xterm: ^4.0.0

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.29.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.11.1
  mocktail: ^1.0.4
  riverpod_generator: ^3.0.3

flutter:
  uses-material-design: true
