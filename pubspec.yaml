name: alera
description: "Alera desktop agentic development environment for workspace terminals"
publish_to: 'none'
version: 0.56.0+92

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.9
  file_selector: ^1.1.0
  fl_chart: ^1.2.0
  flutter_riverpod: ^3.3.2
  logging: ^1.3.0
  path: ^1.9.1
  pasteboard: ^0.5.0
  uuid: ^4.6.0
  path_provider: ^2.1.6
  ghostty_vte_flutter: ^0.1.5
  ffi: ^2.2.0
  portable_pty: ^0.0.5
  xterm: ^4.0.0
  desktop_updater: ^2.7.0
  http: ^1.6.0
  image: ^4.9.1
  media_kit: 1.2.6
  media_kit_libs_video: 1.0.7
  media_kit_video: 2.0.1
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  flutter_colorpicker: ^1.1.0
  flutter_svg: ^2.3.0
  wakelock_plus: ^1.7.0
  riverpod_annotation: ^4.0.3
  dart_mappable: ^4.8.0
  desktop_drop: ^0.7.1
  drift: ^2.34.3
  meta: ^1.18.0
  sqlite3: ^3.5.0
  sqlite3_flutter_libs: ^0.6.0+eol
  flutter_local_notifications: ^22.2.0
  screen_retriever: ^0.2.2
  window_manager: ^0.5.2
  crypto: ^3.0.7
  cryptography: ^2.9.0
  toml: ^0.18.0
  alera_native:
    path: rust_builder
  alera_browser:
    path: packages/alera_browser
  flutter_rust_bridge: 2.12.0
  flutter_directory_tree: ^1.0.0
  gpt_markdown: ^1.1.8
  directory_tree: ^1.0.0
  code_forge: ^10.9.0
  re_highlight: ^0.0.3
  vscode_material_icon_theme: ^5.26.0
  lucide_icons_flutter: ^3.1.15
  pdfrx: ^2.4.7
  pretty_qr_code: ^3.6.0
  sentry: ^9.25.0
dev_dependencies:
  alchemist: ^0.14.0
  build_runner: ^2.15.1
  dart_mappable_builder: ^4.8.0
  drift_dev: ^2.34.0
  fake_async: ^1.3.3
  file_selector_platform_interface: ^2.7.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  riverpod_generator: ^4.0.4
  riverpod_lint: ^3.1.4
  url_launcher_platform_interface: ^2.3.2
  yaml: ^3.1.3

dependency_overrides:
  ghostty_vte:
    path: third_party/dart_terminal/pkgs/vte/ghostty_vte
  # Override both upstream pub.dev packages together so Alera consumes the
  # source-clean build hook and verified prebuilts from the maintained fork.
  ghostty_vte_flutter:
    path: third_party/dart_terminal/pkgs/vte/ghostty_vte_flutter
  # Keeps local terminal fixes pinned while upstream PRs are reviewed.
  xterm:
    path: third_party/xterm

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/logo/alera-logo-desktop.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/logo/alera-logo.png"

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/logo/alera-logo.png
    - assets/logo/alera-logo-white.png
    - assets/agents/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
    - family: Alera Codicons
      fonts:
        - asset: assets/fonts/VSCodeCodicons-0.0.46-24.ttf
