name: alera
description: "Alera desktop orchestrator for Codex app-server"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  flutter_markdown_plus: ^1.0.7
  flutter_riverpod: ^3.3.1
  logging: ^1.3.0
  path: ^1.9.1
  shared_preferences: ^2.5.5
  google_fonts: ^8.1.0
  uuid: ^4.5.3
  web_socket_channel: ^3.0.3
  pasteboard: ^0.5.0
  sembast: ^3.8.7
  path_provider: ^2.1.5
  highlight: ^0.7.0
  markdown: ^7.3.1
  remend: ^1.3.1
  url_launcher: ^6.3.2
  ghostty_vte_flutter: ^0.1.3
  xterm: ^4.0.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  ghostty_vte:
    path: third_party/dart_terminal/pkgs/vte/ghostty_vte
  # Keeps local terminal fixes pinned while upstream PRs are reviewed.
  xterm:
    path: third_party/xterm

flutter_launcher_icons:
  macos:
    generate: true
    image_path: "assets/logo/alera-logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/alera-logo.png
    - assets/logo/alera-logo-white.png
