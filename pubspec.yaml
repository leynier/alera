name: alera
description: "Alera desktop orchestrator for Codex app-server"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.0.3
  flutter_markdown_plus: ^1.0.7
  flutter_riverpod: ^3.0.3
  logging: ^1.3.0
  path: ^1.9.1
  shared_preferences: ^2.5.3
  google_fonts: ^8.1.0
  uuid: ^4.5.1
  web_socket_channel: ^3.0.3
  pasteboard: ^0.5.0
  sembast: ^3.7.0
  path_provider: ^2.1.4
  highlight: ^0.7.0
  markdown: ^7.3.0
  remend: ^1.2.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  macos:
    generate: true
    image_path: "assets/logo/alera-logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/alera-logo.png
    - assets/logo/alera-logo-white.png
