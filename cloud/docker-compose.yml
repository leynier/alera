services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alera_cloud
      POSTGRES_USER: alera
      POSTGRES_PASSWORD: alera
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alera -d alera_cloud"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - alera-cloud-postgres:/var/lib/postgresql/data

volumes:
  alera-cloud-postgres:
