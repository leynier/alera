[package]
name = "agent-client-protocol"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
alera-agent-transport = { path = "../alera-agent-transport" }
async-trait = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
