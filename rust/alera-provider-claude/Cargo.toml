[package]
name = "alera-provider-claude"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
alera-agent-transport = { path = "../alera-agent-transport" }
alera-provider-protocol = { path = "../alera-provider-protocol" }
claude-agent-sdk = { path = "../claude-agent-sdk" }
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
