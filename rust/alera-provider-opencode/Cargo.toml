[package]
name = "alera-provider-opencode"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
alera-provider-protocol = { path = "../alera-provider-protocol" }
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
opencode-agent-sdk = { path = "../opencode-agent-sdk" }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
