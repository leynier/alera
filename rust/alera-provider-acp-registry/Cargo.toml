[package]
name = "alera-provider-acp-registry"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "acp-terminal-fixture"
path = "tests/support/acp_terminal_fixture.rs"
doc = false
test = false

[dependencies]
alera-agent-transport = { path = "../alera-agent-transport" }
alera-core = { path = "../alera-core", features = ["async-process"] }
alera-provider-protocol = { path = "../alera-provider-protocol" }
alera-provider-acp = { path = "../alera-provider-acp" }
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
