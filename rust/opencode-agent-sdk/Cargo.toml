[package]
name = "opencode-agent-sdk"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
alera-agent-http = { path = "../alera-agent-http" }
alera-agent-transport = { path = "../alera-agent-transport" }
async-trait = "0.1.92"
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
