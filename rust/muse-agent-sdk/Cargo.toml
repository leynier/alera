[package]
name = "muse-agent-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust port of the provider-facing Muse MSP SDK surface."
license = "MIT"
publish = false

[dependencies]
alera-core = { path = "../alera-core", default-features = false, features = ["async-process"] }
alera-agent-transport = { path = "../alera-agent-transport" }
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.26.0", features = ["v4", "v7"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
