[package]
name = "claude-agent-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for Claude Code's bidirectional stream-json protocol."
license = "MIT"
publish = false

[dependencies]
alera-agent-transport = { path = "../alera-agent-transport" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
async-trait = "0.1.92"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
