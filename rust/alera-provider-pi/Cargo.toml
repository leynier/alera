[package]
name = "alera-provider-pi"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "pi-jsonl-fixture"
path = "tests/support/pi_jsonl_fixture.rs"

[dependencies]
alera-agent-transport = { path = "../alera-agent-transport" }
alera-provider-protocol = { path = "../alera-provider-protocol" }
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
