[package]
name = "alera-agent-http"
version = "0.1.0"
edition = "2021"
description = "Bounded HTTP and streaming transports for Alera agent providers."
publish = false

[[bin]]
name = "managed-process-fixture"
path = "tests/support/managed_process_fixture.rs"

[dependencies]
async-trait = "0.1.92"
alera-agent-transport = { path = "../alera-agent-transport" }
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
