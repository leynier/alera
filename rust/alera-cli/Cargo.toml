[package]
name = "alera-cli"
version = "0.1.0"
edition = "2021"
description = "Alera command line tools (terminal host sidecar)."
publish = false

[[bin]]
name = "alera"
path = "src/main.rs"

[dependencies]
alera-core = { path = "../alera-core", features = ["runtime"] }
clap = { version = "4.6.6", features = ["derive"] }
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "io-std",
    "process",
    "sync",
    "time",
    "signal",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
portable-pty = "0.9.0"
sqlx = { version = "0.9.0", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
] }
anyhow = "1.0.104"
thiserror = "2.0.20"
uuid = { version = "1.26.0", features = ["v4"] }
ed25519-dalek = "3.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hex = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "multipart", "stream"] }
sha2 = "0.11.0"
hmac = "0.13.0"
hkdf = "0.13.0"
chacha20poly1305 = "0.11.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
rand = "0.10.2"
zeroize = "1.9.0"
png = "0.18.1"
jsonschema = { version = "0.52.1", default-features = false }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.4"
url = "2.5.8"
dirs = "6.0.0"
dunce = "1.0.5"
regex = "1.13.1"
git2 = { version = "0.21.0", default-features = false }
ignore = "0.4.33"
notify = "8.2.0"
axum = { version = "0.8.9", features = ["http1", "tokio"] }
bytes = "1.12.1"
if-addrs = "0.15.0"
hound = "3.5.1"
serde_urlencoded = "0.7.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
async-trait = "0.1.92"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "registry",
    "fmt",
    "env-filter",
    "std",
] }
# Default features pull in native-tls, which would put a second TLS stack in a
# sidecar that already speaks rustls through reqwest and sqlx.
sentry = { version = "0.49.2", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
] }

[target.'cfg(all(target_arch = "x86_64", any(target_os = "linux", target_os = "windows")))'.dependencies]
whisper-rs = { version = "0.16.0", features = ["vulkan"] }

[target.'cfg(not(any(target_os = "macos", all(target_arch = "x86_64", any(target_os = "linux", target_os = "windows")))))'.dependencies]
whisper-rs = "0.16.0"

# Signalling a PTY shell's descendants. Already in the tree through
# portable-pty, so declaring it directly adds no crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
keyring-core = "1.0.0"
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
whisper-rs = { version = "0.16.0", features = ["coreml", "metal"] }

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1.0.151"
base64 = "0.23.1"
