[package]
name = "alera-cli"
version = "0.1.0"
edition = "2021"
description = "Alera command line tools (terminal host sidecar)."
publish = false

[[bin]]
name = "alera"
path = "src/main.rs"

[dependencies]
alera-core = { path = "../alera-core", features = ["runtime"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "io-std",
    "process",
    "sync",
    "time",
    "signal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
portable-pty = "0.9"
sqlx = { version = "0.9", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "tls-rustls",
] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = "3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = "0.6"
zeroize = "1"
png = "0.18"
jsonschema = { version = "0.49", default-features = false }
tokio-tungstenite = "0.30"
toml = "1.1"
url = "2.5"
dirs = "6"
regex = "1"
axum = { version = "0.8", features = ["http1", "tokio"] }
bytes = "1"
serde_urlencoded = "0.7"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
async-trait = "0.1.91"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "registry",
    "fmt",
    "env-filter",
    "std",
] }
# Default features pull in native-tls, which would put a second TLS stack in a
# sidecar that already speaks rustls through reqwest and sqlx.
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
] }
keyring = { version = "3.6.3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
    "vendored",
] }

# Signalling a PTY shell's descendants. Already in the tree through
# portable-pty, so declaring it directly adds no crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.30", default-features = false, features = ["proxies", "connection", "tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = "0.25"
windows = { version = "0.62.2", features = ["Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-application-services = "0.3"
objc2-core-foundation = "0.3"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
base64 = "0.23"
git2 = { version = "0.21", default-features = false }
