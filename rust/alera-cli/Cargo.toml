[package]
name = "alera-cli"
version = "0.1.0"
edition = "2021"
description = "Alera command line tools (terminal host sidecar)."
publish = false

[[bin]]
name = "alera"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
portable-pty = "0.8"
sea-orm = { version = "1", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
] }
# Used directly only to configure the SQLite pool (WAL + synchronous pragmas)
# before handing it to SeaORM; the version must track sea-orm's sqlx.
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio-rustls",
] }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
base64 = "0.22"
