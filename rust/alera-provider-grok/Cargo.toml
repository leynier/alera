[package]
name = "alera-provider-grok"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
alera-agent-transport = { path = "../alera-agent-transport" }
alera-provider-protocol = { path = "../alera-provider-protocol" }
alera-provider-acp = { path = "../alera-provider-acp" }
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
