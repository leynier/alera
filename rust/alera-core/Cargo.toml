[package]
name = "alera-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
# The async spawn helper, for crates that only need `child_process`.
async-process = ["dep:tokio"]
workflow-approval = ["dep:hmac", "dep:tempfile", "dep:zeroize", "dep:windows"]
runtime = ["async-process", "workflow-approval", "dep:anyhow", "dep:chrono", "dep:chrono-tz", "dep:jsonschema", "dep:sqlx", "dep:thiserror", "dep:url", "dep:yaml-rust2"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
trash = "5.2.6"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"], optional = true }
chrono-tz = { version = "0.10.4", optional = true }
git2 = { version = "0.21.0", default-features = false }
globset = "0.4.20"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
hex = "0.4.3"
ignore = "0.4.33"
hmac = { version = "0.13", optional = true }
jsonschema = { version = "0.49", default-features = false, optional = true }
regex = "1.13.1"
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "chrono",
], optional = true }
thiserror = { version = "2.0.20", optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1.53.1", features = ["process"], optional = true }
url = { version = "2.5.8", optional = true }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
yaml-rust2 = { version = "0.11", default-features = false, optional = true }
zeroize = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
url = "2.5.8"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
