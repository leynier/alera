[package]
name = "alera-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
# The async spawn helper, for crates that only need `child_process`.
async-process = ["dep:tokio"]
workflow-approval = ["dep:hmac", "dep:tempfile", "dep:zeroize", "dep:windows"]
runtime = ["async-process", "workflow-approval", "dep:anyhow", "dep:chrono", "dep:chrono-tz", "dep:jsonschema", "dep:sqlx", "dep:thiserror", "dep:url", "dep:yaml-rust2"]

[dependencies]
anyhow = { version = "1", optional = true }
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"], optional = true }
chrono-tz = { version = "0.10", optional = true }
git2 = { version = "0.21", default-features = false }
ignore = "0.4"
hmac = { version = "0.12", optional = true }
jsonschema = { version = "0.49", default-features = false, optional = true }
same-file = "1.0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "chrono",
], optional = true }
thiserror = { version = "2", optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["process"], optional = true }
url = { version = "2.5", optional = true }
uuid = { version = "1", features = ["v4", "serde"] }
yaml-rust2 = { version = "0.11", default-features = false, optional = true }
zeroize = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
