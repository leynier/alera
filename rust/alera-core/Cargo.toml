[package]
name = "alera-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
# The async spawn helper, for crates that only need `child_process`.
async-process = ["dep:tokio"]
runtime = ["async-process", "dep:anyhow", "dep:chrono", "dep:serde", "dep:serde_json", "dep:sqlx", "dep:thiserror", "dep:uuid"]

[dependencies]
anyhow = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"], optional = true }
git2 = { version = "0.21", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio-rustls",
    "chrono",
], optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["process"], optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
