[package]
name = "alera_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

# `rust/` is both the flutter_rust_bridge library package (`alera_native`, built
# by cargokit via `cargo build --manifest-path rust/Cargo.toml`, no `-p`) and the
# workspace root that hosts the `alera-cli` terminal-host sidecar (built by the
# native hooks via `cargo build --locked -p alera-cli`). One lock file, one
# target dir; the FRB build only compiles the root package.
[workspace]
members = ["alera-cli", "alera-core"]
resolver = "2"

[dependencies]
alera-core = { path = "alera-core", default-features = false }
flutter_rust_bridge = "=2.12.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
axum = { version = "0.8", features = ["http1", "tokio"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
# Local git operations via libgit2. Network features (https/ssh/openssl) are
# disabled on purpose: git2-backed operations here are local; operations that
# need network credentials (clone/fetch/pull/push) are delegated to the git CLI
# via git_cmd, which uses the system credential helper.
git2 = { version = "0.21", default-features = false }
# Thin wrapper around the git CLI for networked git operations.
git_cmd = "0.6"
camino = "1"
ignore = "0.4"
notify = "8"
trash = "5"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
regex = "1"
merman = { version = "0.7.0-alpha.1", default-features = false, features = ["render"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
