[package]
name = "alera-provider-protocol"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
alera-agent-transport = { path = "../alera-agent-transport" }
async-trait = "0.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
yaml-rust2 = { version = "0.11", default-features = false }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
